name: Benchmarks

on:
  workflow_dispatch: 

jobs:
  bench:
    name: Bench (ubuntu-24.04)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel Cython cmake matplotlib

      - name: Build and install cykit
        env:
          DEBUG: "1"
        run: pip install -e . -v

      - name: Run IPC benchmark suite
        run: python benchmarks/ipc/run_bench.py

      - name: Run queue benchmark suite
        run: python benchmarks/queue/run_bench.py

      - name: Commit updated charts and README
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update benchmark charts and README"
          file_pattern: "bench/ipc/results/latest.png bench/queue/results/latest.png README.md"