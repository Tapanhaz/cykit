# .github/workflows/ci.yml
name: CI

on:
  pull_request:

jobs:
  test:
    name: Build + Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: windows-2025-vs2026
          - os: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel Cython cmake pytest

      - name: Build and install cykit
        env:
          DEBUG: "1"
        run: pip install -e . -v

      - name: Debug (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y gdb
          cd tests/logging_handlers

          echo "=== ldd output ==="
          ldd ../../cykit/cylogger/cylogger*.so

          echo "=== gdb backtrace ==="
          gdb -batch -ex "set pagination off" -ex run -ex "thread apply all bt full" -ex quit --args python -u debug_run.py

      - name: Run test suite
        run: pytest tests/ -vvv -s --tb=long --showlocals --setup-show