name: CI

on:
  workflow_dispatch: 

jobs:
  test:
    name: Build + Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: windows-2025-vs2026
          - os: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel Cython cmake pytest
      
      - name: Python build config
        if: runner.os == 'macOS'
        run: |
          python - <<'PY'
          import sys
          import sysconfig
          import platform

          print("platform:", sys.platform)
          print("machine:", platform.machine())
          print("ARCHFLAGS:", sysconfig.get_config_var("ARCHFLAGS"))
          print("CFLAGS:", sysconfig.get_config_var("CFLAGS"))
          print("LDSHARED:", sysconfig.get_config_var("LDSHARED"))
          print("EXT_SUFFIX:", sysconfig.get_config_var("EXT_SUFFIX"))
          PY

      - name: Build and install cykit
        env:
          DEBUG: "1"
          ARCHFLAGS: ${{ runner.os == 'macOS' && '-arch arm64' || '' }}
        run: pip install -e . -v
      
      - name: Upload generated Cython sources
        uses: actions/upload-artifact@v4
        with:
          name: generated-cpp-${{ runner.os }}-${{ matrix.python-version }}
          path: |
            **/*.cpp
            **/*.c

#      - name: Debug (Linux)
#        if: runner.os == 'Linux'
#        run: |
#          sudo apt-get install -y gdb
#          cd tests/logging_handlers
#
#          echo "=== ldd output ==="
#          ldd ../../cykit/cylogger/cylogger*.so
#
#          echo "=== gdb backtrace ==="
#          gdb -batch -ex "set pagination off" -ex run -ex "thread apply all bt full" -ex quit --args python -u debug_run.py

      - name: Run test suite
        run: pytest tests/ -vvv -s --tb=long --showlocals --setup-show